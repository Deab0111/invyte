services:
  postgres:
    image: postgres:16
    container_name: invyte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invyte
      POSTGRES_PASSWORD: invyte_password
      POSTGRES_DB: invyte
    ports:
      - "5432:5432"
    volumes:
      - invyte_postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invyte-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://invyte:invyte_password@postgres:5432/invyte
    depends_on:
      - postgres

volumes:
  invyte_postgres_data: