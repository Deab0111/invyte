services:
  postgres:
    image: postgres:16
    container_name: invyte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invyte
      POSTGRES_PASSWORD: invyte_password
      POSTGRES_DB: invyte
    ports:
      - "5432:5432"
    volumes:
      - invyte_postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invyte-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: invyte
      DB_PASSWORD: invyte_password
      DB_NAME: invyte
      JWT_SECRET: change_this_later
    depends_on:
      - postgres

volumes:
  invyte_postgres_data: